# Development Docker Compose for django-inshard tests.
#
# Usage:
#   docker compose up -d        # Start PostgreSQL
#   uv run pytest               # Run tests
#   docker compose down         # Stop PostgreSQL

services:
    db:
        image: "postgres:17"
        environment:
            POSTGRES_DB: "test_inshard"
            POSTGRES_USER: "inshard"
            POSTGRES_PASSWORD: "inshard"
        ports:
            - "127.0.0.1:5432:5432"
        healthcheck:
            test:
                - "CMD-SHELL"
                - "pg_isready -U inshard -d test_inshard"
            interval: "5s"
            timeout: "5s"
            retries: 5
